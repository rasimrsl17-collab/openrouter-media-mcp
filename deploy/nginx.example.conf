# Inside the existing `server { ... }` block that serves https://velorafy.com
# Makes https://velorafy.com/mcp-media/media/<file> reach the container's /media/<file>.
# Only /media is exposed; /mcp stays private.

location /mcp-media/media/ {
    proxy_pass http://127.0.0.1:3400/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;          # video seeking
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    client_max_body_size 0;
}

# then: sudo nginx -t && sudo systemctl reload nginx
# and in openrouter-media-mcp/.env:  PUBLIC_BASE_URL=https://velorafy.com/mcp-media
